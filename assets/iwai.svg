<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <style>
    .b { transform-origin: 32px 32px; animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(-6deg); }
      75% { transform: translateY(-3px) rotate(6deg); }
    }
    text { font-family: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", "Microsoft YaHei", sans-serif; font-weight: 700; }
  </style>
  <g class="b">
    <circle cx="32" cy="32" r="28" fill="#e53935"/>
    <text x="32" y="33" font-size="34" fill="#fff" text-anchor="middle" dominant-baseline="central">祝</text>
  </g>
</svg>
